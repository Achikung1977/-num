<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Dashboard Number</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;
  padding:15px;

  font-family:Arial,sans-serif;

  background:#f4f6f9;
}

/* Header */

.header{

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:20px;
  gap:10px;
}

.title{

  font-size:28px;
  font-weight:bold;
}

.top-buttons{

  display:flex;
  gap:10px;
}

.refresh-btn{

  background:#007bff;
  color:white;
}

.auto-btn{

  background:#28a745;
  color:white;
}

.top-buttons button{

  border:none;
  border-radius:10px;

  padding:12px 18px;

  cursor:pointer;

  font-size:16px;
}

/* Grid */

.grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(110px,1fr));

  gap:12px;
}

/* Button */

.number-btn{

  border:none;

  border-radius:16px;

  padding:22px 10px;

  font-size:28px;

  font-weight:bold;

  color:white;

  cursor:pointer;

  transition:0.2s;
}

.number-btn:active{

  transform:scale(0.95);
}

.active{

  background:#28a745;
}

.inactive{

  background:#dc3545;
}

/* Pagination */

.pagination{

  margin-top:25px;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:10px;

  flex-wrap:wrap;
}

.pagination button{

  border:none;
  border-radius:10px;

  padding:12px 18px;

  background:#007bff;

  color:white;

  cursor:pointer;
}

/* Modal */

.modal{

  display:none;

  position:fixed;

  z-index:999;

  left:0;
  top:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,0.5);
}

.modal-content{

  background:white;

  width:90%;
  max-width:360px;

  margin:30% auto;

  padding:25px;

  border-radius:18px;

  text-align:center;
}

.modal-buttons{

  margin-top:20px;

  display:flex;

  gap:10px;
}

.modal-buttons button{

  flex:1;

  border:none;

  border-radius:10px;

  padding:14px;

  cursor:pointer;

  font-size:16px;
}

.confirm-btn{

  background:#dc3545;
  color:white;
}

.cancel-btn{

  background:#6c757d;
  color:white;
}

/* Mobile */

@media(max-width:768px){

  .header{

    flex-direction:column;
    align-items:stretch;
  }

  .title{

    text-align:center;
    font-size:24px;
  }

  .top-buttons{

    width:100%;
  }

  .top-buttons button{

    flex:1;
  }

  .number-btn{

    font-size:24px;
    padding:18px 8px;
  }
}

</style>

</head>

<body>

<!-- Header -->

<div class="header">

  <div class="title">
    Dashboard Number
  </div>

  <div class="top-buttons">

    <button
      class="refresh-btn"
      onclick="manualRefresh()">

      Refresh
    </button>

    <button
      class="auto-btn"
      onclick="toggleRealtime()"
      id="realtimeBtn">

      Real-time ON
    </button>

  </div>

</div>

<!-- Grid -->

<div id="grid" class="grid"></div>

<!-- Pagination -->

<div class="pagination">

  <button onclick="changePage(-1)">
    ก่อนหน้า
  </button>

  <span id="pageInfo"></span>

  <button onclick="changePage(1)">
    ถัดไป
  </button>

</div>

<!-- Modal -->

<div id="confirmModal" class="modal">

  <div class="modal-content">

    <h3>ยืนยันรายการ</h3>

    <p id="modalText"></p>

    <div class="modal-buttons">

      <button
        class="confirm-btn"
        onclick="confirmInactive()">

        ยืนยัน
      </button>

      <button
        class="cancel-btn"
        onclick="closeModal()">

        ยกเลิก
      </button>

    </div>

  </div>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbydw60gocJhQY7oYIZ3b5_n7xTkXHBpixVcid3yPK_j8xKeJV-HDCS7Z_ihI42cl9aP/exec';

let currentPage = 1;
let totalPages = 1;

let selectedRow = null;
let selectedNumber = null;

let realtime = true;

// ====================
// LOAD DATA
// ====================

async function loadData(){

  try{

    const response =
      await fetch(
        `${API_URL}?action=getNumbers&page=${currentPage}`
      );

    const result =
      await response.json();

    renderData(result);

  }catch(err){

    console.log(err);
  }
}

// ====================
// RENDER
// ====================

function renderData(result){

  const grid =
    document.getElementById('grid');

  grid.innerHTML = '';

  totalPages =
    result.totalPages;

  result.data.forEach(item => {

    const btn =
      document.createElement('button');

    btn.className =
      'number-btn ' +
      (
        item.status === 'Inactive'
        ? 'inactive'
        : 'active'
      );

    btn.innerText =
      item.number;

    if(
      item.status === 'Inactive'
    ){

      btn.disabled = true;
    }

    btn.onclick = () => {

      openModal(
        item.row,
        item.number
      );
    };

    grid.appendChild(btn);
  });

  document.getElementById('pageInfo')
    .innerText =
    `หน้า ${currentPage} / ${totalPages}`;
}

// ====================
// PAGE
// ====================

function changePage(direction){

  currentPage += direction;

  if(currentPage < 1)
    currentPage = 1;

  if(currentPage > totalPages)
    currentPage = totalPages;

  loadData();
}

// ====================
// REFRESH
// ====================

function manualRefresh(){

  loadData();
}

// ====================
// REALTIME
// ====================

function toggleRealtime(){

  realtime = !realtime;

  document.getElementById(
    'realtimeBtn'
  ).innerText =
    realtime
      ? 'Real-time ON'
      : 'Real-time OFF';
}

// refresh realtime ทุก 3 วิ

setInterval(() => {

  if(realtime){

    loadData();
  }

},3000);

// ====================
// MODAL
// ====================

function openModal(row, number){

  selectedRow = row;
  selectedNumber = number;

  document.getElementById(
    'modalText'
  ).innerText =
    `ต้องการเปลี่ยนเลข ${number} เป็น Inactive ?`;

  document.getElementById(
    'confirmModal'
  ).style.display = 'block';
}

function closeModal(){

  document.getElementById(
    'confirmModal'
  ).style.display = 'none';
}

// ====================
// CONFIRM
// ====================

async function confirmInactive(){

  closeModal();

  const buttons =
    document.querySelectorAll('.number-btn');

  buttons.forEach(btn => {

    if(
      btn.innerText ==
      selectedNumber
    ){

      btn.classList.remove('active');

      btn.classList.add('inactive');

      btn.disabled = true;
    }
  });

  // auto next page

  const lastButton =
    buttons[buttons.length - 1];

  if(
    lastButton &&
    lastButton.innerText ==
    selectedNumber
  ){

    if(currentPage < totalPages){

      currentPage++;

      setTimeout(() => {

        loadData();

      },300);
    }
  }

  // save background

  fetch(API_URL,{

    method:'POST',

    body:JSON.stringify({

      action:'setInactive',

      row:selectedRow
    })
  });
}

// ====================
// CLOSE MODAL
// ====================

window.onclick = function(event){

  const modal =
    document.getElementById(
      'confirmModal'
    );

  if(event.target == modal){

    closeModal();
  }
}

// ====================
// START
// ====================

loadData();

</script>

</body>
</html>
