<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }

    .number-btn {
      padding: 20px;
      font-size: 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    .active {
      background: #28a745;
      color: white;
    }

    .inactive {
      background: #dc3545;
      color: white;
    }

    .pagination {
      margin-top: 25px;
    }

    .pagination button {
      padding: 10px 18px;
      margin: 0 5px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    .pagination button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background: white;
      width: 320px;
      margin: 15% auto;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .modal-content h3 {
      margin-top: 0;
    }

    .modal-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .modal-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .confirm-btn {
      background: #dc3545;
      color: white;
    }

    .cancel-btn {
      background: #6c757d;
      color: white;
    }
  </style>
</head>

<body>

  <h2>Dashboard Running Number</h2>

  <div id="grid" class="grid"></div>

  <div class="pagination">
    <button id="prevBtn" onclick="changePage(-1)">
      ก่อนหน้า
    </button>

    <span id="pageInfo"></span>

    <button id="nextBtn" onclick="changePage(1)">
      ถัดไป
    </button>
  </div>

  <!-- Modal -->

  <div id="confirmModal" class="modal">

    <div class="modal-content">

      <h3>ยืนยันรายการ</h3>

      <p id="modalText">
        ต้องการเปลี่ยนสถานะเป็น Inactive ?
      </p>

      <div class="modal-buttons">

        <button class="confirm-btn" onclick="confirmInactive()">
          ยืนยัน
        </button>

        <button class="cancel-btn" onclick="closeModal()">
          ยกเลิก
        </button>

      </div>

    </div>

  </div>

  <script>

    let currentPage = 1;
    let totalPages = 1;

    let selectedRow = null;
    let selectedNumber = null;

    // โหลดข้อมูล
    function loadData() {

      google.script.run
        .withSuccessHandler(renderData)
        .getNumbers(currentPage);
    }

    // แสดงผลข้อมูล
    function renderData(result) {

      const grid = document.getElementById('grid');

      grid.innerHTML = '';

      totalPages = result.totalPages;

      result.data.forEach(item => {

        const btn = document.createElement('button');

        btn.className =
          'number-btn ' +
          (item.status === 'Inactive'
            ? 'inactive'
            : 'active');

        btn.innerText = item.number;

        // ถ้า inactive แล้ว กดไม่ได้
        if (item.status === 'Inactive') {
          btn.disabled = true;
        }

        // เมื่อคลิก
        btn.onclick = () => {
          openModal(item.row, item.number);
        };

        grid.appendChild(btn);
      });

      // แสดงเลขหน้า
      document.getElementById('pageInfo').innerText =
        `หน้า ${currentPage} / ${totalPages}`;

      // ปุ่มก่อนหน้า
      document.getElementById('prevBtn').disabled =
        currentPage === 1;

      // ปุ่มถัดไป
      document.getElementById('nextBtn').disabled =
        currentPage === totalPages;
    }

    // เปลี่ยนหน้า
    function changePage(direction) {

      currentPage += direction;

      if (currentPage < 1) currentPage = 1;

      if (currentPage > totalPages)
        currentPage = totalPages;

      loadData();
    }

    // เปิด Modal
    function openModal(row, number) {

      selectedRow = row;
      selectedNumber = number;

      document.getElementById('modalText').innerText =
        'ต้องการเปลี่ยนเลข ' +
        number +
        ' เป็น Inactive ?';

      document.getElementById('confirmModal').style.display =
        'block';
    }

    // ปิด Modal
    function closeModal() {

      document.getElementById('confirmModal').style.display =
        'none';
    }

    // ยืนยัน
   function confirmInactive() {

  google.script.run
    .withSuccessHandler(() => {

      closeModal();

      // ตรวจสอบว่ากดตัวสุดท้ายของหน้าหรือไม่
      const buttons =
        document.querySelectorAll('.number-btn');

      const lastButton =
        buttons[buttons.length - 1];

      // ถ้าปุ่มที่กด เป็นปุ่มสุดท้ายของหน้า
      if (
        lastButton &&
        lastButton.innerText == selectedNumber
      ) {

        // ถ้ายังมีหน้าถัดไป
        if (currentPage < totalPages) {

          currentPage++;

        }
      }

      // โหลดข้อมูลใหม่
      loadData();

    })
    .setInactive(selectedRow);
}

    // โหลดครั้งแรก
    loadData();

  </script>

</body>

</html>
