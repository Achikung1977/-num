<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <title>Dashboard Number</title>

  <style>

    body{
      font-family:Arial;
      background:#f4f6f9;
      padding:20px;
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:15px;
      max-width:900px;
      margin:auto;
    }

    .number-btn{
      padding:20px;
      font-size:24px;
      border:none;
      border-radius:12px;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    .active{
      background:#28a745;
    }

    .inactive{
      background:#dc3545;
    }

    .pagination{
      margin-top:20px;
    }

    .pagination button{
      padding:10px 20px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      background:#007bff;
      color:white;
    }

    .modal{
      display:none;
      position:fixed;
      z-index:999;
      left:0;
      top:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
    }

    .modal-content{
      background:white;
      width:320px;
      margin:15% auto;
      padding:25px;
      border-radius:15px;
      text-align:center;
    }

    .modal-buttons{
      margin-top:20px;
      display:flex;
      justify-content:center;
      gap:10px;
    }

    .confirm-btn{
      background:#dc3545;
      color:white;
    }

    .cancel-btn{
      background:#6c757d;
      color:white;
    }

    .modal button{
      padding:10px 20px;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }

  </style>

</head>

<body>

<h2>Dashboard Running Number</h2>

<div id="grid" class="grid"></div>

<div class="pagination">

  <button onclick="changePage(-1)">
    ก่อนหน้า
  </button>

  <span id="pageInfo"></span>

  <button onclick="changePage(1)">
    ถัดไป
  </button>

</div>

<!-- Modal -->

<div id="confirmModal" class="modal">

  <div class="modal-content">

    <h3>ยืนยันรายการ</h3>

    <p id="modalText"></p>

    <div class="modal-buttons">

      <button class="confirm-btn"
        onclick="confirmInactive()">

        ยืนยัน

      </button>

      <button class="cancel-btn"
        onclick="closeModal()">

        ยกเลิก

      </button>

    </div>

  </div>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbydw60gocJhQY7oYIZ3b5_n7xTkXHBpixVcid3yPK_j8xKeJV-HDCS7Z_ihI42cl9aP/exec';

let currentPage = 1;
let totalPages = 1;

let selectedRow = null;
let selectedNumber = null;

// โหลดข้อมูล

async function loadData(){

  const response =
    await fetch(
      `${API_URL}?action=getNumbers&page=${currentPage}`
    );

  const result = await response.json();

  renderData(result);
}

// แสดงผล

function renderData(result){

  const grid =
    document.getElementById('grid');

  grid.innerHTML = '';

  totalPages = result.totalPages;

  result.data.forEach(item => {

    const btn =
      document.createElement('button');

    btn.className =
      'number-btn ' +
      (item.status === 'Inactive'
        ? 'inactive'
        : 'active');

    btn.innerText = item.number;

    if(item.status === 'Inactive'){
      btn.disabled = true;
    }

    btn.onclick = () => {
      openModal(item.row, item.number);
    };

    grid.appendChild(btn);
  });

  document.getElementById('pageInfo')
    .innerText =
    `หน้า ${currentPage} / ${totalPages}`;
}

// เปลี่ยนหน้า

function changePage(direction){

  currentPage += direction;

  if(currentPage < 1)
    currentPage = 1;

  if(currentPage > totalPages)
    currentPage = totalPages;

  loadData();
}

// เปิด Modal

function openModal(row, number){

  selectedRow = row;
  selectedNumber = number;

  document.getElementById('modalText')
    .innerText =
    `ต้องการเปลี่ยนเลข ${number} เป็น Inactive ?`;

  document.getElementById('confirmModal')
    .style.display = 'block';
}

// ปิด Modal

function closeModal(){

  document.getElementById('confirmModal')
    .style.display = 'none';
}

// ยืนยัน

async function confirmInactive(){

  await fetch(API_URL,{
    method:'POST',
    body:JSON.stringify({
      action:'setInactive',
      row:selectedRow
    })
  });

  closeModal();

  const buttons =
    document.querySelectorAll('.number-btn');

  const lastButton =
    buttons[buttons.length - 1];

  if(
    lastButton &&
    lastButton.innerText == selectedNumber
  ){

    if(currentPage < totalPages){
      currentPage++;
    }
  }

  loadData();
}

// โหลดครั้งแรก

loadData();

</script>

</body>
</html>
