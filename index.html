<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1.0
  "
/>

<title>Dashboard Number</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  padding:15px;

  background:#f4f6f9;

  font-family:Arial,sans-serif;
}

/* Header */

.header{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  margin-bottom:20px;

  gap:10px;
}

.title{

  font-size:28px;

  font-weight:bold;
}

.top-buttons{

  display:flex;

  gap:10px;
}

.top-buttons button{

  border:none;

  border-radius:12px;

  padding:12px 18px;

  cursor:pointer;

  font-size:16px;

  color:white;
}

.refresh-btn{

  background:#007bff;
}

.realtime-btn{

  background:#28a745;
}

/* Grid */

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(110px,1fr)
    );

  gap:12px;
}

/* Number Button */

.number-btn{

  border:none;

  border-radius:18px;

  padding:22px 10px;

  font-size:30px;

  font-weight:bold;

  color:white;

  cursor:pointer;

  transition:0.2s;
}

.number-btn:active{

  transform:scale(0.95);
}

.active{

  background:#28a745;
}

.inactive{

  background:#dc3545;
}

/* Footer */

.footer{

  margin-top:25px;

  text-align:center;

  font-size:18px;

  font-weight:bold;
}

/* Modal */

.modal{

  display:none;

  position:fixed;

  z-index:999;

  left:0;
  top:0;

  width:100%;
  height:100%;

  background:
    rgba(0,0,0,0.5);
}

.modal-content{

  background:white;

  width:90%;

  max-width:360px;

  margin:30% auto;

  padding:25px;

  border-radius:20px;

  text-align:center;
}

.modal-buttons{

  margin-top:20px;

  display:flex;

  gap:10px;
}

.modal-buttons button{

  flex:1;

  border:none;

  border-radius:12px;

  padding:14px;

  font-size:16px;

  cursor:pointer;
}

.confirm-btn{

  background:#dc3545;

  color:white;
}

.cancel-btn{

  background:#6c757d;

  color:white;
}

/* Mobile */

@media(max-width:768px){

  .header{

    flex-direction:column;

    align-items:stretch;
  }

  .title{

    text-align:center;

    font-size:24px;
  }

  .top-buttons{

    width:100%;
  }

  .top-buttons button{

    flex:1;
  }

  .number-btn{

    font-size:24px;

    padding:18px 8px;
  }
}

</style>

</head>

<body>

<!-- Header -->

<div class="header">

  <div class="title">
    Dashboard Number
  </div>

  <div class="top-buttons">

    <button
      class="refresh-btn"
      onclick="loadData()">

      Refresh
    </button>

    <button
      class="realtime-btn"
      id="realtimeBtn"
      onclick="toggleRealtime()">

      Real-time ON
    </button>

  </div>

</div>

<!-- Grid -->

<div
  id="grid"
  class="grid">
</div>

<!-- Footer -->

<div
  id="pageInfo"
  class="footer">
</div>

<!-- Modal -->

<div
  id="confirmModal"
  class="modal">

  <div class="modal-content">

    <h3>ยืนยันรายการ</h3>

    <p id="modalText"></p>

    <div class="modal-buttons">

      <button
        class="confirm-btn"
        onclick="confirmInactive()">

        ยืนยัน
      </button>

      <button
        class="cancel-btn"
        onclick="closeModal()">

        ยกเลิก
      </button>

    </div>

  </div>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbydw60gocJhQY7oYIZ3b5_n7xTkXHBpixVcid3yPK_j8xKeJV-HDCS7Z_ihI42cl9aP/exec';

const PAGE_SIZE = 20;

let realtime = true;

let selectedRow = null;

let selectedNumber = null;

let allData = [];

// =========================
// LOAD DATA
// =========================

async function loadData(){

  try{

    const response =
      await fetch(
        `${API_URL}?action=getNumbers`
      );

    allData =
      await response.json();

    renderDashboard();

  }catch(err){

    console.log(err);
  }
}

// =========================
// RENDER DASHBOARD
// =========================

function renderDashboard(){

  const grid =
    document.getElementById('grid');

  grid.innerHTML = '';

  // =====================
  // หา Active ตัวแรก
  // =====================

  const firstActiveIndex =
    allData.findIndex(item =>
      item.status !== 'Inactive'
    );

  // เสร็จทั้งหมด

  if(firstActiveIndex === -1){

    grid.innerHTML = `
      <h2>
        เสร็จสิ้นทั้งหมด
      </h2>
    `;

    document
      .getElementById('pageInfo')
      .innerText = '';

    return;
  }

  // =====================
  // แสดง 20 รายการ
  // =====================

  const visibleData =
    allData.slice(
      firstActiveIndex,
      firstActiveIndex +
      PAGE_SIZE
    );

  visibleData.forEach((item,index)=>{

    const btn =
      document.createElement('button');

    btn.className =
      'number-btn ' +
      (
        item.status === 'Inactive'
        ? 'inactive'
        : 'active'
      );

    btn.innerText =
      item.number;

    // กดได้เฉพาะตัวแรก

    const canClick =
      index === 0 &&
      item.status !== 'Inactive';

    if(!canClick){

      btn.disabled = true;

      btn.style.opacity = 0.5;

      btn.style.cursor =
        'not-allowed';
    }

    if(canClick){

      btn.onclick = ()=>{

        openModal(
          item.row,
          item.number
        );
      };
    }

    // inactive

    if(
      item.status === 'Inactive'
    ){

      btn.disabled = true;
    }

    grid.appendChild(btn);
  });

  // footer

  document
    .getElementById('pageInfo')
    .innerText =

    `แสดงลำดับ ${
      visibleData[0].number
    } - ${
      visibleData[
        visibleData.length - 1
      ].number
    }`;
}

// =========================
// MODAL
// =========================

function openModal(
  row,
  number
){

  selectedRow = row;

  selectedNumber = number;

  document
    .getElementById('modalText')
    .innerText =

    `ต้องการเปลี่ยนเลข ${number}
    เป็น Inactive ?`;

  document
    .getElementById('confirmModal')
    .style.display =
    'block';
}

function closeModal(){

  document
    .getElementById('confirmModal')
    .style.display =
    'none';
}

// =========================
// CONFIRM
// =========================

async function confirmInactive(){

  closeModal();

  // เปลี่ยนหน้า UI ทันที

  const item =
    allData.find(x =>
      x.row === selectedRow
    );

  if(item){

    item.status =
      'Inactive';
  }

  // render ใหม่ทันที

  renderDashboard();

  // save background

  fetch(API_URL,{

    method:'POST',

    body:JSON.stringify({

      action:'setInactive',

      row:selectedRow
    })
  });
}

// =========================
// REALTIME
// =========================

function toggleRealtime(){

  realtime = !realtime;

  document
    .getElementById('realtimeBtn')
    .innerText =

    realtime
      ? 'Real-time ON'
      : 'Real-time OFF';
}

// refresh ทุก 3 วิ

setInterval(()=>{

  if(realtime){

    loadData();
  }

},3000);

// =========================
// CLOSE MODAL
// =========================

window.onclick = function(event){

  const modal =
    document
      .getElementById(
        'confirmModal'
      );

  if(event.target == modal){

    closeModal();
  }
}

// =========================
// START
// =========================

loadData();

</script>

</body>
</html>
